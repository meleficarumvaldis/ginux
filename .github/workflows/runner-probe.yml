name: runner-probe
on:
  push:
    branches: [kvm-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Describe the hosted runner
        run: |
          lscpu | grep -E 'Model name|Vendor ID|^CPU\(s\)|Virtualization|Hypervisor'
          free -g | head -2
          df -h / | tail -1
          ls -l /dev/kvm || echo "no /dev/kvm"
          grep -c -E 'svm|vmx' /proc/cpuinfo || true
          id
